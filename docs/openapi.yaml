        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }
    delete:
      tags: [call]
      operationId: unfavoriteCall
      summary: Remove the call from the user's favorites
      description: Idempotent.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/CallID"
    post:
      tags: [call]
      operationId: sharePhoto
      summary: Show a library photo to the partner during an active call
      description: |
        Attaches the photo to the call (only when it is not attached to a call yet), sends the partner
        `photo_shared` over the signaling socket (with the partner's own `is_favorite`) and a `photo_shared`
        alert push. Returns the photo as seen by the sender.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharePhotoRequest"
      responses:
        "200":
          description: The shared photo
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: photo_id missing or not a UUID }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed call ID, no such call, or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call is not active }
        - { code: "photo:invalid_state", status: 409, when: The photo upload was not completed }
        - { code: internal_error, status: 500, when: Database or storage failed }

  /v1/calls/{id}/signal:
    parameters:
      - $ref: "#/components/parameters/CallID"
    get:
      tags: [call]
      operationId: signalCall
      summary: Signaling WebSocket of a live call
      description: |
        Upgrades to a WebSocket carrying JSON text frames for WebRTC negotiation and call state. The full
        message catalogue, state machine, timers and close codes are in [signaling.md](./signaling.md).

        Authenticate with `Authorization: Bearer <token>` or, when the client cannot set headers, the
        `token` query parameter (`/v1/calls/{id}/signal?token=<token>`). The call must be `ringing` or
        `active` and live in this server process. The pre-upgrade checks return the usual error envelope;
        once upgraded, errors arrive as `{"type":"error"}` frames and the socket closes with 1000 (call
        ended or not live), 1008 (not a participant) or 4000 (replaced by a newer socket of the same user).
        The server pings every 15 seconds; frames larger than 64 KiB close the socket.
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        "101":
          description: Switching protocols to WebSocket
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call is not ringing or active, or is not live in this process }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/photos/upload-url:
    post:
      tags: [photo]
      operationId: createPhotoUploadURL
      summary: Reserve a photo and get presigned upload URLs
      description: |
        Creates a `pending` photo and returns presigned `PUT` URLs (valid 15 minutes) for the original and the
        client-generated thumbnail. Upload both with a plain `PUT` of the raw bytes, then call
        `POST /v1/photos/{id}/complete`. Pending photos are invisible to every read endpoint and do not count toward
        the storage quota; `size_bytes + thumbnail_size_bytes` must fit in the remaining quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadURLRequest"
      responses:
        "201":
          description: Upload URLs
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadURLResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Unsupported content_type, sizes out of range, or width/height below 1 }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "storage:quota_exceeded", status: 402, when: "size_bytes + thumbnail_size_bytes does not fit in the remaining quota (meta: used_bytes, quota_bytes, required_bytes)" }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database or storage failed }

  /v1/photos/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [photo]
      operationId: completePhoto
      summary: Publish an uploaded photo (uploader only)
      description: |
        Verifies that both objects exist and fit the limits (original 25 MiB, thumbnail 1 MiB), stores the
        actual original size and marks the photo `uploaded`. Oversized objects are deleted and reported as
        `photo:upload_incomplete`; upload again through a new `upload-url`.
      responses:
        "200":
          description: The published photo
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: forbidden, status: 403, when: The user is not the uploader }
        - { code: not_found, status: 404, when: Malformed ID or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "photo:invalid_state", status: 409, when: The photo is already uploaded }
        - { code: "photo:upload_incomplete", status: 409, when: An object is missing or exceeds its size limit }
        - { code: internal_error, status: 500, when: Database or storage failed }

  /v1/photos:
    get:
      tags: [photo]
      operationId: listPhotos
      summary: List the couple's uploaded photos
      description: Newest first. Download URLs expire at `url_expires_at` (1 hour).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
