      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID, pending photo, or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database or storage failed }
    delete:
      tags: [photo]
      operationId: deletePhoto
      summary: Delete a photo
      description: Deletes the photo (pending or uploaded, by either partner) and its stored objects.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/photos/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    put:
      tags: [photo]
      operationId: favoritePhoto
      summary: Add the photo to the user's favorites
