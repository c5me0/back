openapi: 3.1.0
info:
  title: CAMEO API
  version: 0.1.0
  summary: Backend API of CAMEO, a voice-call and photo-sharing app for couples.
  description: |
    JSON over HTTP. Every request and response body uses snake_case keys. Timestamps are RFC 3339 in UTC.

    **Authentication.** `POST /v1/auth/phone/verify` returns a bearer token. Send it as
    `Authorization: Bearer <token>`; clients that cannot set headers (WebSocket) may pass `?token=<token>`
    instead. Sessions last 90 days and are extended to 90 days from now on the first authenticated request
    after an hour of inactivity.

    **Errors.** Every error body is an `ErrorResponse` envelope `{code, message, meta?}`. The HTTP status is
    derived from `code` (see `x-error-codes` on each operation). Validation failures return `invalid_request`
    with `meta.fields` (field name to message). Unexpected failures return `internal_error` with
    `meta.request_id`. Unknown routes return `404 not_found`; a known route with the wrong method returns
    `405` with code `invalid_request`.

    **Path IDs.** A malformed UUID in a path parameter is reported as `404 not_found`, the same as a missing
    or foreign resource. Calls and photos of another couple are always `not_found`.

    **Pagination.** List endpoints return `{items, has_more, next_cursor}` ordered by `created_at DESC, id DESC`.
    Pass `next_cursor` back as `cursor` to fetch the next page.

    **Request-ID.** Every response carries a `Request-ID` header (UUIDv7) that also appears in server logs.

    **Purchases and storage.** Every feature is free; each couple has a storage quota. Usage is the couple's
    uploaded photos (original + thumbnail bytes) plus call recordings (mixed file bytes); pending photo uploads do
    not count. The quota is the server's `quota.free_bytes` unless a member has an active RevenueCat entitlement
    listed in `quota.tiers`; then it is the largest such tier among the two members. `GET /v1/me` `storage` reports
    usage, quota, tier and who pays for it. Without the server's `quota` config section storage is unlimited
    (`storage.quota_bytes` is null).

    Only two operations enforce the quota, both with `402 storage:quota_exceeded` and
    `meta: {used_bytes, quota_bytes, required_bytes}`: `POST /v1/photos/upload-url` (the photo and thumbnail
    sizes must fit) and `POST /v1/calls` (blocked once usage has reached the quota; `required_bytes` is 1). Reads,
    deletes and every other route stay available over quota, so the user can free space.

    Purchases go through RevenueCat. The SDK's App User ID must be the CAMEO user `id` (configure it right after
    sign-in; do not call `logOut`). Storage tiers are subscription entitlements (e.g. `cameo_pro`); the consumable
    `cameo_recovery` product buys one data restore. Both are couple-scoped: restore credits are the unused
    `cameo_recovery` purchases of either member. After any purchase or restore in the SDK, and on app launch, call
    `POST /v1/me/purchases/sync`. Read the quota from `GET /v1/me` `storage`, not from the SDK's CustomerInfo (the
    partner's CustomerInfo has no entitlement).

    `POST /v1/couple/restore` returns `402 purchase:required` with `meta.required: restore` when data would move and
    the couple has no restore credit. It does not check the quota: restored data may push the couple over it, after
    which uploads and new calls are blocked until data is deleted or a larger tier is bought. Without the server's
    `revenuecat` config section (local development) restore is free, sync is a no-op and the webhook is not served.

    **Live calls.** The WebSocket signaling protocol, call state machine and push payloads are documented in
    [signaling.md](./signaling.md).
servers:
  - url: http://localhost:18080
    description: Local development (`make run`)
security:
  - bearerAuth: []
tags:
  - name: probe
    description: Liveness and readiness
  - name: auth
    description: Phone sign-in and sign-out
  - name: account
    description: The authenticated user's profile
  - name: couple
    description: Pairing with a partner
  - name: device
    description: Push token registration
  - name: call
    description: Calls, call history and live call actions
  - name: photo
    description: The couple's shared photo library
  - name: webhook
    description: Inbound webhooks from third-party services

paths:
  /livez:
    get:
      tags: [probe]
      operationId: live
      summary: Liveness probe
      description: 200 while the process should keep running, 503 while the instance is draining (`/tmp/drain` exists). No body.
      security: []
      responses:
        "200":
          description: Alive
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
        "503":
          description: Draining
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"

  /readyz:
    get:
      tags: [probe]
      operationId: ready
      summary: Readiness probe
      description: 200 when the database answers a ping within 2 seconds and the instance is not draining, otherwise 503. No body.
      security: []
      responses:
        "200":
          description: Ready
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
        "503":
          description: Draining or database unreachable
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"

  /v1/auth/phone/start:
    post:
      tags: [auth]
      operationId: phoneStart
      summary: Send a verification code
      description: |
        Sends an SMS verification code through Twilio Verify. Without Twilio configured, no code is sent and the
        configured `otp.fake_code` (default `000000`) is accepted by `/v1/auth/phone/verify`.

        Rate limits: 5 requests per minute per client IP, and 3 requests per 10 minutes per `phone`
        (falls back to the client IP when the body has no phone). Exceeding either returns `429 rate_limit`
        with `Retry-After` and `X-RateLimit-*` headers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneStartRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Body is not JSON or phone is not E.164 }
        - { code: rate_limit, status: 429, when: IP or phone rate limit exceeded }
        - { code: internal_error, status: 500, when: SMS provider failed }

  /v1/auth/phone/verify:
    post:
      tags: [auth]
      operationId: phoneVerify
      summary: Verify the code and sign in
      description: |
        Checks the code and signs the phone's user in, creating the user (with a fresh pairing code) on first
        sign-in. Returns a session token valid for 90 days.

        Rate limit: 10 requests per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneVerifyRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Body is not JSON or fields fail validation }
        - { code: "auth:invalid_code", status: 400, when: Code is wrong or expired }
        - { code: rate_limit, status: 429, when: IP rate limit exceeded }
        - { code: internal_error, status: 500, when: Verification provider or database failed }

  /v1/auth/signout:
    post:
      tags: [auth]
      operationId: signout
      summary: Revoke the current session
      description: Deletes the session of the presented token. Devices registered with this session are deleted with it.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Get the authenticated user
      responses:
        "200":
          description: The user
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: Database failed }
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update profile and alert preferences
      description: Only the fields present in the body change. `display_name` is trimmed and cannot be cleared.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: display_name is blank or longer than 30 characters }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/me/purchases/sync:
    post:
      tags: [account]
      operationId: syncPurchases
      summary: Re-read the user's purchases from RevenueCat
      description: |
        Fetches the caller's subscriber record from RevenueCat (`GET /v1/subscribers/{app_user_id}`) and
        updates the stored storage tier (the largest active entitlement listed in `quota.tiers`) and `cameo_recovery`
        purchases. Call it after a purchase or restore
        completes in the SDK and on app launch. Without the `revenuecat` config section this is a no-op.
      responses:
        "200":
          description: The updated user
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: RevenueCat or database failed }

  /v1/couple:
    get:
      tags: [couple]
      operationId: getCouple
      summary: Get the authenticated user's couple
      description: Includes `restorable`, the data waiting in previous couples of the same pair.
      responses:
        "200":
          description: The couple
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }
    post:
      tags: [couple]
      operationId: connectCouple
      summary: Connect with the owner of a pairing code
      description: |
        Pairs the authenticated user with the user owning `code`. On success both users receive new pairing
        codes and the partner receives a `partner_connected` alert push. When the same two users were paired
        before, `restorable` counts the calls and photos left in their previous couples; offer the `cameo_recovery`
        purchase and `POST /v1/couple/restore`.

        Rate limit: 10 requests per minute per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectCoupleRequest"
      responses:
        "201":
          description: Connected
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: code is not 6 digits }
        - { code: "couple:self", status: 400, when: The code is the user's own }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "couple:code_not_found", status: 404, when: No user owns the code }
        - { code: "couple:already_connected", status: 409, when: The user already has a partner }
        - { code: "couple:partner_unavailable", status: 409, when: The code owner already has a partner }
        - { code: rate_limit, status: 429, when: Per-user rate limit exceeded }
        - { code: internal_error, status: 500, when: Database failed }
    delete:
      tags: [couple]
      operationId: disconnectCouple
      summary: Disconnect from the partner
      description: |
        Dissolves the couple, force-ends a ringing or active call of the couple (status `ended`) and sends the
        partner a `partner_disconnected` alert push. Calls and photos stay with the dissolved couple and are no
        longer reachable by either user.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/couple/code:
    post:
      tags: [couple]
      operationId: regeneratePairingCode
      summary: Replace the user's pairing code
      responses:
        "200":
          description: The new pairing code
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: Database failed or every generated code collided }

  /v1/couple/restore:
    post:
      tags: [couple]
      operationId: restoreCouple
      summary: Move data of previous couples of the same pair into the current couple
      description: |
        Moves every call and photo of previous (dissolved) couples of the same two users into the current
        couple and consumes one restore credit (`User.restore_credits`, shared by the couple). The partner
        receives a `data_restored` alert push with `couple_id`, `calls` and `photos`.

        Idempotent: a couple that was already restored (`Couple.restored_at` set) returns zeros and consumes
        nothing. Offer the `cameo_recovery` purchase when `Couple.restorable` is non-zero, then call
        `POST /v1/me/purchases/sync` before this endpoint. The quota is not checked: restored data
        may push the couple over its quota, after which uploads and new calls return `402 storage:quota_exceeded`.
      responses:
        "200":
          description: Number of moved calls and photos
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restorable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "purchase:required", status: 402, when: "Data would move and the couple has no restore credit (meta.required: restore)" }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/devices:
    post:
      tags: [device]
      operationId: registerDevice
      summary: Register a push token
      description: |
        Binds an APNs token to the current session (upsert on `(platform, token)`); a token previously
        registered by another account moves to this one. Register the regular APNs token as `apns` and the
        PushKit token as `apns_voip`. Incoming calls are delivered only to `apns_voip` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Unknown platform, missing platform, or token empty or longer than 200 characters }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/devices/{token}:
    delete:
      tags: [device]
      operationId: deleteDevice
      summary: Unregister a push token
      description: Deletes the user's device rows with this token (any platform).
      parameters:
        - name: token
          in: path
          required: true
          description: The push token as registered.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: The user has no device with this token }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls:
    post:
      tags: [call]
      operationId: createCall
      summary: Call the partner
      description: |
        Creates a `ringing` call with the authenticated user as caller, sends the partner an `incoming_call`
        VoIP push and starts the 60-second ring timer. Use the returned `ice_servers` for the
        `RTCPeerConnection`, then open the signaling WebSocket (`GET /v1/calls/{id}/signal`). Rejected with
        `402 storage:quota_exceeded` once the couple's storage usage has reached its quota.
      responses:
        "201":
          description: Ringing
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCallResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "storage:quota_exceeded", status: 402, when: "Storage used by the couple has reached the quota (meta: used_bytes, quota_bytes, required_bytes = 1)" }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:busy", status: 409, when: The couple already has a ringing or active call }
        - { code: internal_error, status: 500, when: Database failed }
    get:
      tags: [call]
      operationId: listCalls
      summary: List the couple's calls
      description: Newest first. Includes calls in every status.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Favorite"
      responses:
        "200":
          description: A page of calls
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Malformed cursor, limit outside 1-100, or favorite not a boolean }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}:
    parameters:
      - $ref: "#/components/parameters/CallID"
    get:
      tags: [call]
      operationId: getCall
      summary: Get a call with highlights, transcript, recording and shared photos
      description: |
        `highlights` are ordered by `offset_seconds`, `photos` (uploaded only) by `created_at` ascending.
        `recording_url` is set once the transcript pipeline uploaded the mixed recording (m4a, AAC mono);
        it and the photo URLs expire at `url_expires_at` (1 hour).
      responses:
        "200":
          description: The call
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database or storage failed }
    delete:
      tags: [call]
      operationId: deleteCall
      summary: Delete a finished call
      description: Deletes the call with its highlights and recordings. Photos shared in the call stay in the library, detached from the call.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call is ringing or active }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/CallID"
    post:
      tags: [call]
      operationId: declineCall
      summary: Decline a ringing call (callee only)
      description: Moves a `ringing` call to `declined`. Connected signaling sockets receive `ended` and close.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: forbidden, status: 403, when: The user is the caller }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call is not ringing }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}/end:
    parameters:
      - $ref: "#/components/parameters/CallID"
    post:
      tags: [call]
      operationId: endCall
      summary: Hang up a ringing or active call
      description: |
        Same as sending `hangup` over the signaling socket. A caller hanging up a `ringing` call makes it
        `missed`; every other case makes it `ended`.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call already finished }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}/highlights:
    parameters:
      - $ref: "#/components/parameters/CallID"
    post:
      tags: [call]
      operationId: createHighlight
      summary: Mark a moment of an active call
      description: |
        `offset_seconds` is measured by the client from the call's `started_at`. The other participant receives
        `highlight_added` over the signaling socket. Highlights are emphasised in the generated summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHighlightRequest"
      responses:
        "201":
          description: The highlight
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: offset_seconds missing or negative }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID or no such call in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: "call:invalid_state", status: 409, when: The call is not active }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/calls/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/CallID"
    put:
      tags: [call]
      operationId: favoriteCall
      summary: Add the call to the user's favorites
      description: Idempotent. Favorites are per user.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
