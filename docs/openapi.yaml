        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID, pending photo, or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }
    delete:
      tags: [photo]
      operationId: unfavoritePhoto
      summary: Remove the photo from the user's favorites
      description: Idempotent.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: not_found, status: 404, when: Malformed ID, pending photo, or no such photo in the couple }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database failed }

  /v1/webhooks/revenuecat:
    post:
      tags: [webhook]
      operationId: revenueCatWebhook
      summary: RevenueCat webhook receiver
      description: |
        Served only when `revenuecat.webhook_secret` is configured (otherwise `404 not_found`).

        Authenticated by the `X-RevenueCat-Webhook-Signature: t=<unix>,v1=<hex>` header, where `v1` is the
        hex HMAC-SHA256 of `"<t>.<raw body>"` keyed with `webhook_secret`; `t` must be within 5 minutes of
        the server clock. `TEST` events return 200 immediately. Any other event makes the server re-read the
        affected users (`app_user_id`, `original_app_user_id`, `aliases`, `transferred_from`,
        `transferred_to`) from RevenueCat. A 500 makes RevenueCat retry.
      security: []
      parameters:
        - name: X-RevenueCat-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^t=\\d+,v1=[0-9a-f]+$"
          examples:
            signature:
              value: t=1790000000,v1=5d41402abc4b2a76b9719d911017c592ae2f5e3b8d1c6f0e8a3b7c9d2e4f6a8b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhook"
      responses:
        "200":
          description: Processed. Body is `{}`.
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: unauthenticated, status: 401, when: Signature missing, malformed, wrong or outside the 5-minute tolerance }
        - { code: internal_error, status: 500, when: RevenueCat or database failed while syncing }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `POST /v1/auth/phone/verify`.
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: The same session token as a query parameter, for clients that cannot set headers (WebSocket). Accepted on every authenticated route; prefer the header.

  headers:
    RequestID:
      description: UUIDv7 identifying the request in server logs. Present on every response.
      schema:
        type: string
        format: uuid

  parameters:
    CallID:
      name: id
      in: path
      required: true
      description: Call ID. A malformed UUID returns `404 not_found`.
      schema:
        type: string
        format: uuid
    PhotoID:
      name: id
      in: path
      required: true
      description: Photo ID. A malformed UUID returns `404 not_found`.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: "`next_cursor` of the previous page."
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    Favorite:
      name: favorite
      in: query
      required: false
      description: When true, only items the authenticated user favorited. Parsed with Go `strconv.ParseBool` (`true`, `1`, `t`, ...).
      schema:
        type: boolean
        default: false

  responses:
    NoContent:
      description: Success, no body
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
    BadRequest:
      description: "`invalid_request` or a domain code mapped to 400 (see `x-error-codes`)"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: "validation failed: phone: must be an E.164 phone number."
            meta:
              fields:
                phone: must be an E.164 phone number
    Unauthenticated:
      description: "`unauthenticated`: token missing, invalid, revoked or expired"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unauthenticated
            message: invalid token
    Forbidden:
      description: "`forbidden`: the user may not perform this action on the resource"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: "`purchase:required`: the couple lacks the purchase named in `meta.required` (`restore`)"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "purchase:required"
            message: restore purchase required
            meta:
              required: restore
    QuotaExceeded:
      description: "`storage:quota_exceeded`: the couple's storage quota cannot hold `meta.required_bytes` more bytes (`meta: {used_bytes, quota_bytes, required_bytes}`)"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "storage:quota_exceeded"
            message: storage quota exceeded
            meta:
              used_bytes: 999000000
              quota_bytes: 1000000000
              required_bytes: 2400000
    NotFound:
      description: "`not_found` or a domain code mapped to 404 (see `x-error-codes`)"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "couple:not_connected"
            message: couple not connected
    Conflict:
      description: A domain code mapped to 409 (see `x-error-codes`)
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "call:busy"
            message: a call is already in progress
    RateLimited:
      description: "`rate_limit`"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          description: Seconds of the rate-limit window.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: rate_limit
            message: too many requests
    InternalError:
      description: "`internal_error`"
      headers:
        Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal_error
            message: internal server error
            meta:
              request_id: 01926d3e-7c1a-7b8e-9f00-3a1b2c3d4e5f

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable detail for logs; do not show verbatim to users.
        meta:
          type: object
          description: "Optional details: `fields` (validation messages by field) for `invalid_request`, `request_id` for `internal_error`, `required` (`restore`) for `purchase:required`, `used_bytes`, `quota_bytes` and `required_bytes` for `storage:quota_exceeded`."
          properties:
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
              format: uuid
            required:
              type: string
              enum: [restore]
            used_bytes:
              type: integer
              format: int64
            quota_bytes:
              type: integer
              format: int64
            required_bytes:
              type: integer
              format: int64
          additionalProperties: true

    ErrorCode:
      type: string
      description: |
        HTTP status per code: internal_error 500, invalid_request 400, unauthenticated 401, forbidden 403,
        not_found 404, rate_limit 429, auth:invalid_code 400, couple:not_connected 404,
        couple:code_not_found 404, couple:self 400, couple:already_connected 409,
        couple:partner_unavailable 409, call:busy 409, call:invalid_state 409, photo:upload_incomplete 409,
        photo:invalid_state 409, purchase:required 402, storage:quota_exceeded 402.
      enum:
        - internal_error
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - rate_limit
        - "auth:invalid_code"
        - "couple:not_connected"
        - "couple:code_not_found"
        - "couple:self"
        - "couple:already_connected"
        - "couple:partner_unavailable"
        - "call:busy"
        - "call:invalid_state"
        - "photo:upload_incomplete"
        - "photo:invalid_state"
        - "purchase:required"
        - "storage:quota_exceeded"

    CallStatus:
      type: string
      enum: [ringing, active, ended, missed, declined, failed]

    TranscriptStatus:
      type: string
      description: |
        none: nothing was recorded (the call never became active). pending: queued for the pipeline.
        processing: encoding, uploading and transcribing. completed: transcript saved (title and summary are
        set when the transcript has speech). skipped: recording uploaded but OpenAI is not configured.
        failed: the pipeline failed.
      enum: [none, pending, processing, completed, failed, skipped]

    DevicePlatform:
      type: string
      description: "`apns` for alert pushes, `apns_voip` for PushKit (incoming calls)."
      enum: [apns, apns_voip]

    Cursor:
      type: string
      description: base64url without padding of created_at UnixNano (8 bytes big-endian) followed by the 16 UUID bytes. Treat as opaque.
      pattern: "^[A-Za-z0-9_-]{32}$"

    Page:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
        has_more:
          type: boolean
        next_cursor:
          description: Set when has_more is true.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"

    CallPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Call"

    PhotoPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Photo"

    Partner:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]

    User:
      type: object
      required: [id, phone, display_name, pairing_code, call_alert, highlight_alert, partner, storage, restore_credits, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: E.164
          examples: ["+821012345678"]
        display_name:
          type: [string, "null"]
        pairing_code:
          type: string
          pattern: "^\\d{6}$"
          description: The code the partner enters in `POST /v1/couple`. Replaced after every connect.
        call_alert:
          type: boolean
          description: Receive the `missed_call` alert push.
        highlight_alert:
          type: boolean
          description: Receive the `summary_ready` alert push.
        partner:
          description: "null when not connected."
          oneOf:
            - $ref: "#/components/schemas/Partner"
            - type: "null"
        storage:
          $ref: "#/components/schemas/Storage"
        restore_credits:
          type: integer
          minimum: 0
          description: Unused `cameo_recovery` purchases of the user and the partner combined. Consumed by `POST /v1/couple/restore`.
        created_at:
          type: string
          format: date-time

    Storage:
      type: object
      description: |
        Couple-scoped storage usage and quota. Read the quota here, not from the RevenueCat SDK CustomerInfo.
        Without a couple, `used_bytes` is 0 and the tier reflects the user's own purchases.
      required: [used_bytes, quota_bytes, tier, source, until]
      properties:
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes of the couple's uploaded photos (original + thumbnail) and call recordings (mixed file). Pending uploads are not counted.
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: Total quota of the couple in bytes. Null when storage is unlimited (no `quota` server config).
        tier:
          type: [string, "null"]
          description: RevenueCat entitlement id of the active tier raising the quota (e.g. `cameo_pro`). Null on the free tier.
        source:
          type: string
          enum: [self, partner, none]
          description: Whose entitlement grants the tier. `none` on the free tier.
        until:
          type: [string, "null"]
          format: date-time
          description: Expiry of the tier's entitlement (year 9999 for a lifetime entitlement). Null on the free tier.

    CouplePartner:
      type: object
      required: [id, display_name, phone]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        phone:
          type: string

    Couple:
      type: object
      required: [id, partner, connected_at, restorable, restored_at]
      properties:
        id:
          type: string
          format: uuid
        partner:
          $ref: "#/components/schemas/CouplePartner"
        connected_at:
          type: string
          format: date-time
        restorable:
          $ref: "#/components/schemas/Restorable"
        restored_at:
          type: [string, "null"]
          format: date-time
          description: When `POST /v1/couple/restore` moved data into this couple. Null until then.

    Restorable:
      type: object
      description: |
        In `Couple`: calls and photos waiting in previous couples of the same two users; offer the `cameo_recovery`
        purchase when non-zero. As the `POST /v1/couple/restore` response: the counts that were moved.
      required: [calls, photos]
      properties:
        calls:
          type: integer
          minimum: 0
        photos:
          type: integer
          minimum: 0

    Call:
      type: object
      required: [id, status, caller_id, callee_id, started_at, ended_at, title, summary, transcript_status, highlight_count, is_favorite, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CallStatus"
        caller_id:
          type: string
          format: uuid
        callee_id:
          type: string
          format: uuid
        started_at:
          type: [string, "null"]
          format: date-time
          description: When both participants' media connected (the call became active).
        ended_at:
          type: [string, "null"]
          format: date-time
        title:
          type: [string, "null"]
          description: Generated after the call when the transcript has speech.
        summary:
          type: [string, "null"]
        transcript_status:
          $ref: "#/components/schemas/TranscriptStatus"
        highlight_count:
          type: integer
        is_favorite:
          type: boolean
          description: Favorited by the authenticated user.
        created_at:
          type: string
          format: date-time

    Highlight:
      type: object
      required: [id, user_id, offset_seconds, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        offset_seconds:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time

    Segment:
      type: object
      description: One transcribed utterance, timed in seconds from the start of the recording (call started_at).
      required: [speaker_user_id, start, end, text]
      properties:
        speaker_user_id:
          type: string
          format: uuid
        start:
          type: number
        end:
          type: number
        text:
          type: string

    CallDetail:
      allOf:
        - $ref: "#/components/schemas/Call"
        - type: object
          required: [highlights, transcript, recording_url, url_expires_at, photos, ice_servers]
          properties:
            highlights:
              type: array
              items:
                $ref: "#/components/schemas/Highlight"
            transcript:
              type: array
              description: Empty until transcript_status is completed.
              items:
                $ref: "#/components/schemas/Segment"
            recording_url:
              type: [string, "null"]
              format: uri
              description: Presigned GET URL of the mixed recording (audio/mp4). Null until the pipeline uploaded it.
            url_expires_at:
              type: string
              format: date-time
              description: Expiry of recording_url and the photo URLs (1 hour).
            photos:
              type: array
              items:
                $ref: "#/components/schemas/Photo"
            ice_servers:
              type: array
              description: Same as POST /v1/calls ice_servers; the callee uses these for its RTCPeerConnection.
              items:
                $ref: "#/components/schemas/ICEServer"

    ICEServer:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
          examples: [["stun:stun.l.google.com:19302"]]
        username:
          type: string
          description: Omitted when empty.
        credential:
          type: string
          description: Omitted when empty.

    Photo:
      type: object
      required: [id, uploader_id, call_id, content_type, size_bytes, width, height, taken_at, is_favorite, url, thumbnail_url, url_expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        uploader_id:
          type: string
          format: uuid
        call_id:
          type: [string, "null"]
          format: uuid
          description: The call the photo was first shared in.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
        size_bytes:
          type: integer
          format: int64
          description: Actual size of the uploaded original.
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        taken_at:
          type: [string, "null"]
          format: date-time
        is_favorite:
          type: boolean
          description: Favorited by the user the photo is presented to.
        url:
          type: string
          format: uri
          description: Presigned GET URL of the original.
        thumbnail_url:
          type: string
          format: uri
          description: Presigned GET URL of the thumbnail.
        url_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PhoneStartRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 phone number.
          pattern: "^\\+[1-9]\\d{7,14}$"
          examples: ["+821012345678"]

    PhoneVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: "^\\+[1-9]\\d{7,14}$"
        code:
          type: string
          pattern: "^\\d{4,8}$"
          examples: ["000000"]

    PhoneVerifyResponse:
      type: object
      required: [token, expires_at, is_new, user]
      properties:
        token:
          type: string
          description: Bearer token.
        expires_at:
          type: string
          format: date-time
        is_new:
          type: boolean
          description: True when this sign-in created the user.
        user:
          $ref: "#/components/schemas/User"

    UpdateMeRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: Trimmed, then 1-30 characters (runes).
        call_alert:
          type: boolean
        highlight_alert:
          type: boolean

    ConnectCoupleRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^\\d{6}$"

    PairingCodeResponse:
      type: object
      required: [pairing_code]
      properties:
        pairing_code:
          type: string
          pattern: "^\\d{6}$"

    RegisterDeviceRequest:
      type: object
      required: [platform, token]
      properties:
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: APNs or PushKit device token (hex).

    CreateCallResponse:
      type: object
      required: [call, ice_servers]
      properties:
        call:
          $ref: "#/components/schemas/Call"
        ice_servers:
          type: array
          description: ICE servers for the client RTCPeerConnection configuration. May be empty.
          items:
            $ref: "#/components/schemas/ICEServer"

    CreateHighlightRequest:
      type: object
      required: [offset_seconds]
      properties:
        offset_seconds:
          type: number
          minimum: 0
          description: Seconds since the call's started_at.

    SharePhotoRequest:
      type: object
      required: [photo_id]
      properties:
        photo_id:
          type: string
          format: uuid

    UploadURLRequest:
      type: object
      required: [content_type, size_bytes, thumbnail_size_bytes]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          description: Original size, at most 25 MiB.
        thumbnail_size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
          description: Thumbnail size, at most 1 MiB.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        taken_at:
          type: string
          format: date-time

    UploadURLResponse:
      type: object
      required: [photo_id, upload_url, thumbnail_upload_url, expires_at]
      properties:
        photo_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
          description: Presigned PUT URL for the original.
        thumbnail_upload_url:
          type: string
          format: uri
          description: Presigned PUT URL for the thumbnail.
        expires_at:
          type: string
          format: date-time
          description: Expiry of both upload URLs (15 minutes).

    RevenueCatWebhook:
      type: object
      description: RevenueCat webhook envelope. Only the fields the server reads are listed; others are ignored.
      required: [api_version, event]
      properties:
        api_version:
          type: string
          examples: ["1.0"]
        event:
          type: object
          required: [type]
          properties:
            type:
              type: string
              description: RevenueCat event type (`INITIAL_PURCHASE`, `RENEWAL`, `EXPIRATION`, `NON_RENEWING_PURCHASE`, `TRANSFER`, `TEST`, ...).
            app_user_id:
              type: string
            original_app_user_id:
              type: string
            aliases:
              type: array
              items:
                type: string
            transferred_from:
              type: array
              items:
                type: string
            transferred_to:
              type: array
              items:
                type: string
          additionalProperties: true
      additionalProperties: true
