          description: Only photos shared in this call.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of photos
          headers:
            Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-codes:
        - { code: invalid_request, status: 400, when: Malformed cursor or call_id, limit outside 1-100, or favorite not a boolean }
        - { code: unauthenticated, status: 401, when: Token missing, invalid or expired }
        - { code: "couple:not_connected", status: 404, when: The user has no partner }
        - { code: internal_error, status: 500, when: Database or storage failed }

  /v1/photos/{id}:
    parameters:
