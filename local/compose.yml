name: cameo

services:
  cameo:
    build:
      context: ..
    container_name: cameo-local
    ports:
      - "18080:80"
      - "50000:50000/udp"
    volumes:
      - ./config:/config
      - recordings:/data/recordings
    environment:
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "/app/cameo", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
      s3:
        condition: service_healthy
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: application
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
      timeout: 5s
      retries: 5
  bucket-init:
    image: versity/versitygw:latest
    entrypoint: ["sh", "-ec"]
    command: ["mkdir -p /data/cameo"]
    volumes:
      - s3-data:/data
    restart: "no"
  s3:
    image: versity/versitygw:latest
    command: ["--port", ":10900", "--health", "/health", "posix", "/data"]
    ports:
      - "10900:10900"
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10900/health"]
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      bucket-init:
        condition: service_completed_successfully

volumes:
  db-data:
  s3-data:
  recordings:
